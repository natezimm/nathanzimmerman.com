name: CI & Deploy

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  ci:
    # Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quality gate
        run: npm run quality

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH
        env:
          GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -z "$GCP_KNOWN_HOSTS" ]; then
            echo "GCP_KNOWN_HOSTS secret is not set; refusing to connect without a pinned host key"
            exit 1
          fi
          printf '%s\n' "$GCP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat <<EOF2 > ~/.ssh/config
          Host gcp
            HostName ${{ secrets.GCP_HOST }}
            User ${{ secrets.GCP_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
          EOF2

      - name: Deploy to GCP
        run: |
          rsync -avz --delete dist/ gcp:/var/www/nathanzimmerman.com/

      - name: Health check
        run: |
          echo "Waiting for site to be available..."
          sleep 5

          echo "Checking nathanzimmerman.com..."
          curl -f https://nathanzimmerman.com || {
            echo "Health check failed"
            exit 1
          }

          echo "Health check passed"
