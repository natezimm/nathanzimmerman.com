name: Infrastructure

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']

permissions:
  contents: read

jobs:
  terraform:
    # Formatting and validation only. Nothing here can reach the project; plans and applies are run by hand.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      TERRAFORM_VERSION: 1.14.0
      TERRAFORM_SHA256: 33ac217458ba8b44ce2813553083bc132c9a07e41a79c2e3627977682d283093
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Terraform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
