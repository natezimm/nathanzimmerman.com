# Forwards Ask my portfolio's API to its container. Paste this inside the existing HTTPS server block
# for nathanzimmerman.com (the one certbot manages, which serves /var/www/nathanzimmerman.com), above
# its `location /`, then run  sudo nginx -t && sudo systemctl reload nginx.  See deploy/README.md.
location ^~ /api/ask {
    # The API takes GET and POST only, and a question is under 2 KB.
    limit_except GET POST {
        deny all;
    }
    client_max_body_size 4k;

    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace, never append: the API trusts exactly one address, the one nginx saw.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API gives up on Anthropic after 20 seconds; this leaves room for its reply.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
