# Upptime config for a public status page, to copy into a repository made from
# https://github.com/upptime/upptime (Use this template). Upptime runs on that repository's
# GitHub Actions, commits each check's history and serves the page from GitHub Pages, all free.
# Replace the example.com domains with the real ones there, not here. Only the public sites
# belong; a family's Wheelhouse instance is watched by Terraform alone.
owner: natezimm
repo: status

sites:
  - name: Portfolio
    url: https://example.com
  - name: Know Ball
    url: https://knowball.example.com/health
  - name: Wheelhouse demo
    url: https://calendar.example.com/health
  - name: Rabbit Ears demo
    url: https://rabbitears.example.com/api/health
  - name: Brick Breaker resume
    url: https://resume.example.com

status-website:
  cname: status.example.com
  name: Portfolio apps
  introTitle: 'Status of the portfolio apps'
  introMessage: Checked every five minutes from GitHub Actions. Alerts come separately, from Google Cloud Monitoring.
  navbar:
    - title: Status
      href: /
    - title: Portfolio
      href: https://example.com

# Upptime opens an issue when a site goes down and closes it when it is back.
assignees:
  - natezimm
